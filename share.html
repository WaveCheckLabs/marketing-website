<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WaveCheck — Opening surf report</title>
  <meta name="description" content="Opening this surf report in the WaveCheck app.">
  <meta name="theme-color" content="#000000">
  <link rel="canonical" href="https://wavecheck.app/share/">
  <link rel="icon" href="/favicon.png" type="image/png">

  <meta name="robots" content="noindex">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="WaveCheck">
  <meta property="og:title" content="WaveCheck — Live surf reports from local surfers">
  <meta property="og:description" content="Real-time surf conditions posted by the community. Wave size, wind, weather — straight from surfers in the water.">
  <meta property="og:image" content="https://wavecheck.app/og-image.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] },
          colors: {
            primary: { 50:'#f9fafb', 100:'#f3f4f6', 200:'#e5e7eb', 300:'#d1d5db', 400:'#9ca3af', 500:'#6b7280', 600:'#4b5563', 700:'#374151', 800:'#1f2937', 900:'#111827' },
            premium: { 50:'#fffbeb', 100:'#fef3c7', 200:'#fde68a', 300:'#fcd34d', 400:'#fbbf24', 500:'#f59e0b', 600:'#d97706' }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    @keyframes pulse-ring { 0% { transform: scale(0.8); opacity: 0.6; } 100% { transform: scale(1.6); opacity: 0; } }
    .pulse-ring::after { content: ''; position: absolute; inset: 0; border-radius: 9999px; border: 2px solid #f59e0b; animation: pulse-ring 1.6s ease-out infinite; }
  </style>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="bg-black text-white min-h-screen flex flex-col">
  <main class="flex-1 flex items-center justify-center px-6 py-12">
    <div class="max-w-md w-full text-center">
      <div class="relative inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-premium-500/10 mb-6 pulse-ring">
        <img src="/assets/logo-white.png" alt="WaveCheck" class="w-12 h-12">
      </div>

      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">Opening WaveCheck&hellip;</h1>
      <p class="mt-3 text-primary-400 text-base leading-relaxed">If the app doesn't open automatically, download it below.</p>

      <div class="mt-10 flex flex-col sm:flex-row items-center justify-center gap-3">
        <a href="https://apps.apple.com/au/app/wavecheck/id6757846707" class="inline-flex items-center gap-3 px-6 py-3.5 rounded-2xl bg-white text-black font-semibold hover:bg-primary-100 transition shadow-lg shadow-white/10">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
          <span class="text-base font-bold">Download on the App Store</span>
        </a>
        <a href="https://play.google.com/store/apps/details?id=com.viniciusdias.wavecheck" class="inline-flex items-center gap-3 px-6 py-3.5 rounded-2xl bg-primary-800 text-white font-semibold hover:bg-primary-700 transition">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22.018 13.298l-3.919 2.218-3.515-3.493 3.543-3.521 3.891 2.202a1.49 1.49 0 0 1 0 2.594zM1.337.924a1.486 1.486 0 0 0-.112.568v21.017c0 .217.045.419.124.6l11.155-11.087L1.337.924zm12.207 10.065l3.258-3.238L3.45.195a1.466 1.466 0 0 0-.946-.179l11.04 10.973zm0 2.067l-11 10.933c.298.036.612-.016.906-.183l13.324-7.54-3.23-3.21z"/></svg>
          <span class="text-left leading-tight">
            <span class="block text-[10px] font-medium opacity-70 uppercase tracking-wider">Get it on</span>
            <span class="block text-base font-bold">Google Play</span>
          </span>
        </a>
      </div>

      <p class="mt-12 text-xs text-primary-600">
        <a href="index.html" class="underline hover:text-primary-400">Back to wavecheck.app</a>
      </p>
    </div>
  </main>

  <script>
    var APP_STORE_URL = "https://apps.apple.com/au/app/wavecheck/id6757846707";
    var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.viniciusdias.wavecheck";
    var storeUrl = /android/i.test(navigator.userAgent) ? PLAY_STORE_URL : APP_STORE_URL;

    var segments = window.location.pathname.split("/").filter(Boolean);
    var postId = segments[0] === "share" ? segments[1] : null;

    if (postId) {
      var deepLink = "wavecheck://post/" + encodeURIComponent(postId);
      window.location.href = deepLink;

      setTimeout(function () {
        if (!document.hidden) {
          window.location.href = storeUrl;
        }
      }, 1500);
    }
  </script>
</body>
</html>
